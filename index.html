<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="./js/script.js" type="module"></script>
    <title>Weather App</title>
</head>
<body>
    
    <div class="container">
        <div class="header">
            <input name="location" class="location"></input>
            <select name="unitGroup" id="unitGroup">
                <option value="metric" selected>Metric</option>
                <option value="us">US</option>
                <option value="uk">UK</option>
                <option value="base">Scientific</option>
            </select>
        </div>
        <img src="" alt="" class="icon">
        <div class="text">
            <p><span class="temp"></span>, feels like <span class="feelslike"></span></p>
            <p><span class="precipprob"></span> chance of <span class="preciptype"></span> <span class="precip"></span></p>
            <p>wind from <span class="winddir"></span> (<span class="windspeed"></span>)</p>
        </div>
        <div class="alerts"></div>
        <p class="description"></p>
    </div>

</body>
</html>
